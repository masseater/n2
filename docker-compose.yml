services:
  # ローカル開発用Webアプリケーション
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "13000:13000"
    environment:
      - NODE_ENV=development
      - LOCAL_DB_PATH=/app/apps/web/data/n2.db
    command: |
      sh -c "
        corepack enable &&
        pnpm install &&
        pnpm --filter @n2/web db:push:local &&
        pnpm dev
      "

  # DBブラウザ (Drizzle Studio)
  studio:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "14983:4983"
    environment:
      - NODE_ENV=development
    command: |
      sh -c "
        corepack enable &&
        pnpm install &&
        pnpm --filter @n2/web db:studio:local
      "
    profiles:
      - tools

volumes:
  node_modules:
  pnpm-store:
